  <body>
    <main id="demo">
      <noscript>
        <h1>Teletext</h1>
        <p>
          An FFGL effect that sends your clip as a Level 1 teletext page: 40 by
          24 cells of 2 by 3 mosaic sixels in eight colours, where every colour
          change is a control code that costs you a cell. An optimal encoder
          plans each row, the page arrives a few rows a field and tears between
          rows, and bit errors land the teletext way: one bit blanks a cell, two
          bits corrupt a mosaic, and a row never moves.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/teletext">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/teletext/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/teletext/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/teletext">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
